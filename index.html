<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      MEDIXO AI — Building Intelligent Solutions. Engineering the Future.
    </title>
    <meta
      name="description"
      content="Medixo AI engineers AI-powered software, computer vision, and automation for diverse industries, from manufacturing and infrastructure to finance, commerce, and healthcare."
    />
    <meta
      name="keywords"
      content="Medixo AI, AI Engineering, Generative AI, Agentic AI, RAG, Computer Vision, Custom Software Development, Automation, Industrial Technology, Robotics Integration, AgriTech, FinTech, Logistics"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Configurable Canonical URL: dynamically initialized from VITE_CANONICAL_URL or current origin -->
    <meta name="canonical-config" content="dynamic" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MEDIXO AI" />
    <meta
      property="og:title"
      content="MEDIXO AI — Transforming Business Ideas Into Intelligent Digital Solutions"
    />
    <meta
      property="og:description"
      content="From custom software development to advanced AI-powered applications, Medixo AI helps businesses innovate, automate, and scale with modern technology."
    />
    <meta
      property="og:image"
      content="/images/photography/share-engineering.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Software developers reviewing code at a workstation"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="MEDIXO AI — Building Intelligent Solutions. Engineering the Future."
    />
    <meta
      name="twitter:description"
      content="AI, Generative AI, Agentic Systems, RAG architectures, Computer Vision, and custom software engineering tailored to modern business challenges."
    />
    <meta
      name="twitter:image"
      content="/images/photography/share-engineering.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="Software developers reviewing code at a workstation"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="/logo/MedixoEmblemDark.svg"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="/logo/MedixoEmblemWhite.svg"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Local editorial typefaces: no third-party font request -->
    <link
      rel="preload"
      href="/fonts/dm-serif-display-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/dm-serif-display-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/manrope-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Verified Organization Structured Data (no unverified contact claims) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Medixo AI",
        "logo": "/logo/MedixoEmblemDark.svg",
        "slogan": "Building Intelligent Solutions. Engineering the Future.",
        "description": "AI-driven software development and technology solutions company specializing in Artificial Intelligence, Generative AI, Agentic AI, Machine Learning, RAG architectures, Computer Vision, custom software engineering, and business automation.",
        "knowsAbout": [
          "Artificial Intelligence",
          "Generative AI",
          "Agentic AI",
          "Machine Learning",
          "Retrieval-Augmented Generation",
          "Computer Vision",
          "Custom Software Development",
          "Business Process Automation",
          "Data Engineering and Analytics"
        ]
      }
    </script>
  </head>
  <body
    class="bg-white text-[#202020] antialiased selection:bg-[#E5D3C9]/60 selection:text-[#202020]"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
